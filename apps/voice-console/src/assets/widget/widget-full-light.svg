      <rect x="3" y="3" width="54" height="54" rx="13.5" fill="none" stroke="rgba(255,255,255,0.82)" stroke-opacity="0.08" stroke-width="0.9" />
      <path d="M8 13C15 10 24 8 30 8C37 8 45 10 52 13" stroke="rgba(255,255,255,0.82)" stroke-opacity="0.28" stroke-width="1" stroke-linecap="round" />
      <path d="M10 50C17 53 24 54 30 54C36 54 43 53 50 50" stroke="rgba(109,92,66,0.18)" stroke-opacity="0.28" stroke-width="1" stroke-linecap="round" />
      <circle cx="30" cy="24" r="10" stroke="#243044" stroke-width="2.45" stroke-dasharray="45 14" />
      <line x1="30" y1="14" x2="30" y2="24" stroke="#243044" stroke-width="2.45" stroke-linecap="round" />
      <text id="label-power" x="30" y="82" text-anchor="middle" font-family="monospace" font-size="12" fill="#6F7D97">POWER</text>
    </g>
    <g id="btn-hold" transform="translate(100, 0)" cursor="pointer" filter="url(#button-shadow)">
      <rect width="60" height="60" rx="16" fill="url(#button-face)" />
      <rect x="3" y="3" width="54" height="54" rx="13.5" fill="none" stroke="rgba(255,255,255,0.82)" stroke-opacity="0.08" stroke-width="0.9" />
      <path d="M8 13C15 10 24 8 30 8C37 8 45 10 52 13" stroke="rgba(255,255,255,0.82)" stroke-opacity="0.28" stroke-width="1" stroke-linecap="round" />
      <path d="M10 50C17 53 24 54 30 54C36 54 43 53 50 50" stroke="rgba(109,92,66,0.18)" stroke-opacity="0.28" stroke-width="1" stroke-linecap="round" />
      <rect x="22" y="17.5" width="6" height="25" fill="#243044" />
      <rect x="32" y="17.5" width="6" height="25" fill="#243044" />
      <text id="label-hold" x="30" y="82" text-anchor="middle" font-family="monospace" font-size="12" fill="#6F7D97">HOLD</text>
    </g>
    <g id="btn-safety" transform="translate(200, 0)" cursor="pointer" filter="url(#button-shadow)">
      <rect width="60" height="60" rx="16" fill="url(#button-face)" />
      <rect x="3" y="3" width="54" height="54" rx="13.5" fill="none" stroke="rgba(255,255,255,0.82)" stroke-opacity="0.08" stroke-width="0.9" />
      <path d="M8 13C15 10 24 8 30 8C37 8 45 10 52 13" stroke="rgba(255,255,255,0.82)" stroke-opacity="0.28" stroke-width="1" stroke-linecap="round" />
      <path d="M10 50C17 53 24 54 30 54C36 54 43 53 50 50" stroke="rgba(109,92,66,0.18)" stroke-opacity="0.28" stroke-width="1" stroke-linecap="round" />
      <path d="M30 18.5L38 22.5V30C38 35.3 30 40 30 40C30 40 22 35.3 22 30V22.5L30 18.5Z" stroke="#243044" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="30" cy="29.5" r="1.5" fill="#243044" />
      <text id="label-safety" x="30" y="82" text-anchor="middle" font-family="monospace" font-size="11.4" fill="#6F7D97">MIC ARM</text>
    </g>
  </g>

  <g filter="url(#panel-inset)">
    <rect x="14" y="338" width="292" height="74" rx="16" fill="url(#readout-surface)" />
  </g>
  <rect x="14.5" y="338.5" width="291" height="73" rx="15.5" fill="none" stroke="rgba(255,255,255,0.82)" stroke-opacity="0.1" stroke-width="0.85" />
  <path d="M26 347H294" stroke="rgba(255,255,255,0.82)" stroke-opacity="0.16" stroke-width="1" stroke-linecap="round" />
  <path d="M26 404H294" stroke="rgba(109,92,66,0.18)" stroke-opacity="0.18" stroke-width="0.9" stroke-linecap="round" />
  <path d="M28 359L34 365L28 371M48 371H34" stroke="#319795" stroke-width="2.2" opacity="0.9" />
  <text id="context-text" x="54" y="365" font-family="monospace" font-size="15.4" font-weight="700" fill="#243044">OFFLINE • PTT • 0s</text>
  <text id="terminal-text" x="28" y="394" font-family="monospace" font-size="16.2" fill="#6F7D97">LAST &gt; connect to begin</text>

  <g id="btn-config" transform="translate(272, 354)" cursor="pointer">
    <rect width="20" height="20" rx="10" fill="url(#window-face)" stroke="rgba(255,255,255,0.82)" stroke-width="0.8" />
    <path d="M5 6H15" stroke="rgba(255,255,255,0.82)" stroke-opacity="0.12" stroke-width="0.7" stroke-linecap="round" />
    <circle cx="10" cy="6" r="1.2" fill="#6F7D97" />
    <circle cx="10" cy="10" r="1.2" fill="#6F7D97" />
    <circle cx="10" cy="14" r="1.2" fill="#6F7D97" />
  </g>

</svg>
