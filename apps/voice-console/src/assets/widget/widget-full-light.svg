    <g id="btn-talk" cursor="pointer" filter="url(#hero-shadow)">
      <circle r="52" fill="url(#hero-core)" />
      <circle r="52" fill="url(#button-shine)" opacity="0.88" />
      <circle r="47" fill="none" stroke="rgba(255,255,255,0.82)" stroke-opacity="0.12" stroke-width="1.1" />
      <circle r="41.5" fill="none" stroke="rgba(255,255,255,0.82)" stroke-opacity="0.06" stroke-width="0.9" />
      <circle id="talk-active-ring" r="44" fill="none" stroke="#319795" stroke-width="4" opacity="0.18" />
      <path id="mic-icon" d="M0 -16C-4.4 -16 -8 -12.4 -8 -8V8C-8 12.4 -4.4 16 0 16C4.4 16 8 12.4 8 8V-8C8 -12.4 4.4 -16 0 -16Z" stroke="#6F7D97" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-12 4V8.5C-12 14.5 -7 19.5 0 19.5C7 19.5 12 14.5 12 8.5V4" stroke="#6F7D97" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M0 19.5V26M-7 26H7" stroke="#6F7D97" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="-17" y1="17" x2="17" y2="-17" stroke="#D95E5E" stroke-width="3" stroke-linecap="round" id="mic-mute-line" />
    </g>
    <circle cx="-50" cy="-44" r="1.8" fill="rgba(109,92,66,0.18)" opacity="0.52" />
    <circle cx="50" cy="-44" r="1.8" fill="rgba(109,92,66,0.18)" opacity="0.52" />
    <circle cx="-50" cy="44" r="1.8" fill="rgba(109,92,66,0.18)" opacity="0.52" />
    <circle cx="50" cy="44" r="1.8" fill="rgba(109,92,66,0.18)" opacity="0.52" />
  </g>

  <g id="secondary-actions" transform="translate(30, 248)">
