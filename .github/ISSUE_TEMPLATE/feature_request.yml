name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for BioVoice? We'd love to hear it.
        If your request is really a setup or troubleshooting question, check `SUPPORT.md` and the docs first.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: How would this help your workflow? What problem does it solve?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice console UI
        - PyMOL adapter
        - ChimeraX adapter
        - Demo workflows / recipes
        - Scientific workflows (AlphaFold / Rosetta)
        - Documentation
        - Platform support (Linux / Windows)
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches you've considered.
